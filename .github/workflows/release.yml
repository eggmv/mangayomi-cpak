name: Release Mangayomi cpak

on:
  schedule:
    - cron: '0 2 * * *' # Check daily for new upstream releases
  workflow_dispatch:     # Allow manual trigger from GitHub mobile/web

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Latest Upstream Version Tag
        id: upstream
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/kodjodevf/mangayomi/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest upstream version: $LATEST_TAG"

      - name: Build and Push OCI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ghcr.io/eggmv/mangayomi:${{ steps.upstream.outputs.tag }}

      - name: Generate Pinned cpak.json Manifest
        run: |
          # Pull image to ensure local inspection works
          docker pull ghcr.io/eggmv/mangayomi:${{ steps.upstream.outputs.tag }}
          
          # Extract exact SHA256 digest
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/eggmv/mangayomi:${{ steps.upstream.outputs.tag }} | awk -F'@' '{print $2}')
          echo "Generated Digest: $DIGEST"

          # Cleanly update version, digest-pinned image reference, desktop entries (with correct case), and form factors using jq
          jq --arg img "ghcr.io/eggmv/mangayomi@${DIGEST}" \
             --arg ver "${{ steps.upstream.outputs.tag }}" \
             '.image = $img | .version = $ver | .desktop_entries = ["/usr/share/applications/Mangayomi.desktop"] | .form_factors = ["desktop"]' cpak.json > cpaked-manifest.json

          # Rename it for the release artifact
          mv cpaked-manifest.json cpak.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.upstream.outputs.tag }}
          name: Mangayomi ${{ steps.upstream.outputs.tag }}
          files: cpak.json
          body: |
            Automated Singularity OS release for Mangayomi version ${{ steps.upstream.outputs.tag }}.
            - **Container Image:** `ghcr.io/eggmv/mangayomi`
            - **Digest-pinned Manifest:** `cpak.json` (ready for direct download and deployment)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
