name: Cleanup Old Releases, Containers, and Actions

on:
  workflow_dispatch: # Allows manual trigger from GitHub mobile/web
  release:
    types: [published] # Automatically triggers whenever a new release is published

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write # Required to delete old workflow runs

    steps:
      - name: Delete Older GitHub Releases
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 1 # Keeps only the newest release, deletes all older ones
          delete_tags: true # Automatically deletes the Git tags associated with old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Older Container Versions from GHCR
        uses: snok/container-retention-policy@v2
        with:
          account-type: personal
          image-names: mangayomi
          cut-off: 7 days # Keeps containers newer than 7 days, purging older stale builds
          keep-at-least: 1 # Ensures at least the latest container image is always preserved
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete Older Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0 # Deletes all completed runs older than the keep_minimum threshold
          keep_minimum_runs: 2 # Keeps the 2 most recent runs per workflow (active + last build)
