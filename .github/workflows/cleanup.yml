name: Cleanup Old Releases

on:
  workflow_dispatch: # Allows manual trigger from GitHub mobile/web
  release:
    types: [published] # Automatically triggers whenever a new release is published

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete Older Releases and Tags
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 1 # Keeps only the absolute newest release, deletes all older ones
          delete_tags: true # Automatically deletes the Git tags associated with the old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
