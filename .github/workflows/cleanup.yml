name: Cleanup Releases, Containers, and Actions History

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "CLEAN" to confirm deletion of releases, packages, and runs'
        required: true
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        if: ${{ inputs.confirm != 'CLEAN' }}
        run: |
          echo "Error: You must type 'CLEAN' in the confirmation box to run this workflow."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      - name: Delete All Releases
        run: |
          echo "Fetching and deleting all releases..."
          TAGS=$(gh release list --limit 500 --json tagName -q '.[].tagName')
          for tag in $TAGS; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done

      - name: Delete Workflow Runs (Actions History)
        run: |
          echo "Deleting workflow runs..."
          while true; do
            RUN_IDS=$(gh run list --limit 100 --json databaseId -q '.[].databaseId')
            if [ -z "$RUN_IDS" ]; then
              break
            fi
            for id in $RUN_IDS; do
              echo "Deleting workflow run ID: $id"
              gh run delete "$id" || true
            done
          done

      - name: Delete Container Packages (Snok Retention Policy)
        uses: snok/container-retention-policy@v2
        with:
          account-type: personal
          image-names: mangayomi
          cut-off: 0 days UTC   # 0 days UTC deletes all versions immediately
          keep-at-least: 0      # Keep 0 versions (purge all)
          token: ${{ secrets.GH_PAT }}
          token-type: pat
          dry-run: false
