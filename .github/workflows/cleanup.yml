name: Reset Repository History and Assets

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "RESET" to confirm deletion of all history, releases, and packages'
        required: true
        type: string

jobs:
  reset-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation
        if: ${{ inputs.confirm != 'RESET' }}
        run: |
          echo "Error: You must type 'RESET' in the confirmation box to run this workflow."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so we can rewrite it

      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      - name: Delete All Releases
        run: |
          echo "Fetching and deleting all releases..."
          TAGS=$(gh release list --limit 500 --json tagName -q '.[].tagName')
          for tag in $TAGS; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done

      - name: Delete Workflow Runs (Actions History)
        run: |
          echo "Deleting workflow runs..."
          # Loop to fetch and delete runs in batches
          while true; do
            RUN_IDS=$(gh run list --limit 100 --json databaseId -q '.[].databaseId')
            if [ -z "$RUN_IDS" ]; then
              break
            fi
            for id in $RUN_IDS; do
              echo "Deleting workflow run ID: $id"
              gh run delete "$id" || true
            done
          done

      - name: Delete Container Packages
        run: |
          echo "Checking for container packages..."
          # Note: Adjust the package type/name if you use specific packages (CONTAINER, deb, maven, npm, etc.)
          PACKAGES=$(gh api user/packages --paginate --jq '.[] | select(.package_type == "container") | .name' 2>/dev/null || true)
          for pkg in $PACKAGES; do
            echo "Deleting package: $pkg"
            gh api -X DELETE "user/packages/container/$pkg" || true
          done
          
          # If packages belong to an organization instead of a user, use:
          # ORG_PACKAGES=$(gh api orgs/YOUR_ORG_NAME/packages --paginate --jq '.[] | select(.package_type == "container") | .name' 2>/dev/null || true)
          # for pkg in $ORG_PACKAGES; do
          #   gh api -X DELETE "orgs/YOUR_ORG_NAME/packages/container/$pkg" || true
          # done

      - name: Wipe Commit History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to an orphan branch (no commit history)
          git checkout --orphan temp-branch

          # Add all current files
          git add -A

          # Create the fresh initial commit
          git commit -m "Fresh repository start"

          # Force push to main (replace main with your default branch if different)
          git push origin temp-branch:main --force

          # Clean up local branch reference
          git branch -D main || true
          git branch -m main
